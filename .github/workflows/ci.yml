name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      # checkout/setup-node on v5 to clear the Node 20 runtime deprecation
      # warnings. pnpm/action-setup deliberately left on v4: this repo has no
      # `packageManager` field in package.json, so the `version:` input below
      # is the only thing selecting a pnpm version, and that input's semantics
      # are exactly what changes across that action's majors. It works; moving
      # it buys nothing and can only break the install step.
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        # shared has to be built first — apps/api/dist imports it as compiled JS.
        run: pnpm --filter @onusclub/shared run build

      - name: Typecheck (all workspaces)
        run: pnpm -r run typecheck

      # Catches a var added to the api's env schema but never passed through
      # docker-compose.prod.yml. The container would simply never receive it,
      # and the feature would look deliberately disabled in production while
      # .env looked correct. Has happened twice.
      - name: Check env vars are wired through prod compose
        run: node scripts/check-env-wiring.mjs

      # AI campaign drafts. The model call costs money per invocation, so CI
      # never makes one — but both halves worth checking are pure: whether the
      # prompt carries the facts (and keeps merchant text inside the
      # untrusted-content delimiters), and whether an over-long draft is
      # rejected rather than silently trimmed to a sentence cut in half.
      #
      # In this job rather than the smoke job because, unlike check:wallet,
      # nothing here imports config.ts — so it needs no env at all.
      - name: Check AI draft prompt + validation
        run: pnpm --filter @onusclub/api run check:drafts

      # Sign in with Google. A real ID token can only come from a browser
      # signing in to a Google account, so CI checks the contract instead: that
      # a verified token satisfies the enrolment identity requirement on its
      # own, and that nothing else newly does.
      - name: Check Google auth contracts
        run: pnpm --filter @onusclub/api run check:google

      # 🚨 merchants.logo_url was DROPPED in migration 017. It stored a URL
      # built from BASE_URL_API at upload time and frozen forever, so any
      # domain change orphaned every existing logo — silently, because Google
      # caches programLogo by URI and nothing errors when it goes stale.
      #
      # The URL is now derived on every read in src/merchants/logo.ts. Any new
      # reference to the column means someone has started storing derived data
      # again, and the column no longer exists so it would fail at runtime.
      - name: Check nothing references the dropped logo_url column
        run: |
          # Comment lines excluded: several files explain this history on
          # purpose, and flagging the explanation would be absurd.
          hits=$(grep -rn 'logo_url' apps/api/src apps/api/scripts \
                   --include='*.ts' \
                   | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' || true)
          if [ -n "$hits" ]; then
            echo "logo_url is referenced, but the column was dropped in 017:"
            echo "$hits"
            echo ""
            echo "Logo URLs are derived from merchant_assets.version."
            echo "Use loadLogoUrl() / logoUrlFromVersion() in merchants/logo.ts."
            exit 1
          fi
          echo "✓ nothing references the dropped logo_url column"

      # 🚨 Two ways the Google client id silently becomes an empty string in
      # production, both of which look like a correct .env and a missing
      # button. Neither throws, neither logs. See apps/web/src/lib/google.ts.
      #
      # 1. A client component reading NEXT_PUBLIC_*: Next inlines those at
      #    BUILD time while prod compose supplies env at RUNTIME. Every
      #    pre-existing read in this repo is in a server component, which is
      #    the only reason the runtime-only compose block works at all.
      - name: Check no client component reads NEXT_PUBLIC_
        run: |
          # Matches an actual read — `process.env` and NEXT_PUBLIC_ on one
          # line — not prose. google-button.tsx explains at length why it must
          # never do this, and a bare NEXT_PUBLIC_ grep flags that comment.
          hits=""
          for f in $(grep -rl '"use client"' apps/web/src --include='*.tsx' --include='*.ts'); do
            if grep -qE 'process\.env[^\n]*NEXT_PUBLIC_' "$f"; then hits="$hits\n$f"; fi
          done
          if [ -n "$hits" ]; then
            echo "NEXT_PUBLIC_ is read inside a client component:"
            printf "$hits\n"
            echo ""
            echo "Next inlines NEXT_PUBLIC_* at BUILD time, but prod compose"
            echo "supplies env at RUNTIME — this compiles to the empty string"
            echo "in production. Read it in the server component and pass it"
            echo "down as a prop."
            exit 1
          fi
          echo "✓ no client component reads NEXT_PUBLIC_"

      # 2. A statically prerendered page calling googleClientId(): process.env
      #    is then the BUILD environment, not the container's. /signup was
      #    static before this feature and needed force-dynamic adding.
      - name: Check pages reading the Google client id are dynamic
        run: |
          fail=0
          for f in $(grep -rl 'googleClientId' apps/web/src/app --include='page.tsx'); do
            if ! grep -q 'dynamic = "force-dynamic"' "$f"; then
              echo "$f calls googleClientId() but is not force-dynamic"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo ""
            echo "A prerendered page reads process.env at BUILD time, so the"
            echo "client id bakes in as empty and the button never appears."
            echo 'Add: export const dynamic = "force-dynamic";'
            exit 1
          fi
          echo "✓ every page reading the Google client id is force-dynamic"

      # Platform admin is the one privilege that reads across every tenant, and
      # it is deliberately granted only by SQL — there is no API or UI for it.
      # The `platform_admins` table must therefore have exactly one read path
      # in the application: src/admin/authorize.ts, which checks it per request
      # so that DELETE revokes access instantly.
      #
      # A second query against that table somewhere else is how this feature
      # would quietly grow a weaker check (cached, trusted from the JWT, or
      # joined into a query that forgets the staff_users join). Limited to .ts
      # so the migration that creates the table doesn't trip it.
      - name: Check platform_admins has a single read path
        run: |
          hits=$(grep -rn --include='*.ts' "platform_admins" apps/api/src/ \
                   | grep -v "src/admin/authorize.ts" || true)
          if [ -n "$hits" ]; then
            echo "platform_admins is referenced outside src/admin/authorize.ts:"
            echo "$hits"
            exit 1
          fi

      - name: Build api
        run: pnpm --filter @onusclub/api run build

      - name: Build web (Next.js)
        run: pnpm --filter @onusclub/web run build
        env:
          # Build-time only — fakes so Next doesn't crash on missing values.
          # Runtime values come from the container env at boot.
          NEXT_PUBLIC_API_BASE: http://localhost:4000
          NEXT_PUBLIC_WEB_BASE: http://localhost:3001
          NEXTAUTH_SECRET: ci-placeholder-not-used
          NEXTAUTH_URL: http://localhost:3001

  smoke:
    runs-on: ubuntu-latest
    # Job-level env applies to every step. config.ts validates required vars
    # at module-import time, so even the migration step (which transitively
    # imports config.ts via db/pool.js) needs them set. Empty Apple / Google
    # Wallet creds = endpoints 503 gracefully and smoke takes its documented
    # "skipped deep check" branch.
    #
    # NOTE: NODE_ENV is intentionally NOT job-level — pnpm install skips
    # devDependencies when NODE_ENV=production, which would drop @types/node
    # + tsc + tsx and break the build. Set it only on the api-start step.
    env:
      PORT: 4000
      DATABASE_URL: mysql://stampdeck:ci_smoke_pass@127.0.0.1:3306/stampdeck
      GOOGLE_WALLET_ISSUER_ID: "0"
      GOOGLE_WALLET_SA_KEY_PATH: /tmp/nonexistent.json
      JWT_SECRET: ci-jwt-secret-not-used-anywhere-real
      BASE_URL_WEB: http://localhost:3001
      BASE_URL_API: http://localhost:4000
      RESEND_API_KEY: ""
      EMAIL_FROM: OnUsClub <ci@example.com>
      # Lead capture. Set so smoke exercises the real path; unset would make
      # the endpoint 503, which is the safe default but tests nothing.
      LEADS_INGEST_SECRET: ci-leads-secret-not-used-anywhere-real
      LEADS_NOTIFY_EMAIL: ci@example.com
      # APPLE_PASS_TYPE_ID needs to match what the smoke script sends
      # (`pass.com.onusclub.loyalty`) so the auth-required Day 12 routes
      # 401 (as smoke asserts) instead of 404'ing on the passType mismatch.
      # The actual .p12 / WWDR are absent → buildPkPass returns null and
      # the GET /apple-pass endpoint 503s. Smoke handles that branch.
      APPLE_PASS_TYPE_ID: pass.com.onusclub.loyalty
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pass
          MYSQL_DATABASE: stampdeck
          MYSQL_USER: stampdeck
          MYSQL_PASSWORD: ci_smoke_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + api
        # tsc only compiles .ts files. Copy non-TS asset folders into the
        # matching dist/ paths so runtime resolution (which is dist-relative)
        # finds them — same trick as the prod Dockerfile.
        run: |
          pnpm --filter @onusclub/shared run build
          pnpm --filter @onusclub/api run build
          cp -r apps/api/src/db/migrations apps/api/dist/db/migrations
          cp -r apps/api/src/wallet-apple/assets apps/api/dist/wallet-apple/assets

      - name: Run migrations
        working-directory: apps/api
        run: node dist/db/migrate.js

      - name: Start api (background)
        working-directory: apps/api
        # NODE_ENV intentionally left unset → defaults to "development" in
        # config.ts. The smoke script depends on dev-only behaviour like the
        # magic link being returned inline in the auth response (gated on
        # NODE_ENV != "production").
        run: |
          node dist/index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for api health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "api healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "api never became healthy. logs:"
          cat /tmp/api.log
          exit 1

      # Google Wallet cannot be exercised anywhere but production — it is
      # disabled in local dev on purpose, and the API has no way to delete a
      # class once created. So the only check available is on the payload we
      # would have sent. It guards two silent failures: sending the deprecated
      # `locations` field (accepted, stored, never triggers a notification),
      # and forgetting to teach classBrandingDiffers about a new field (which
      # means existing classes never receive it).
      #
      # In this job rather than typecheck-and-build because config.ts validates
      # env at import time and the class id embeds the issuer.
      - name: Check Google Wallet class payload
        run: pnpm --filter @onusclub/api run check:wallet

      - name: Run smoke
        env:
          SMOKE_BASE: http://localhost:4000
        run: pnpm --filter @onusclub/api run smoke

      # Separate suite because granting platform admin is SQL-only, so it needs
      # the database as well as the API. The assertion that matters most is that
      # deleting the grant row locks the admin out immediately, on a token that
      # is still valid — the whole reason the privilege is not a JWT role.
      - name: Run admin smoke
        env:
          SMOKE_BASE: http://localhost:4000
        run: pnpm --filter @onusclub/api run smoke:admin

      # ---- Browser-level tests (backlog item 20) ----
      #
      # Bolted onto this job rather than given its own: mysql and the api are
      # already up here, and duplicating the service block plus a dozen env
      # vars to start them again would be the more fragile arrangement.
      #
      # Only Chromium is installed. These are flow tests — the dashboard has no
      # browser-specific code, and the two surfaces that do (Google and Apple
      # Wallet) are native apps no engine can stand in for.
      - name: Build and start web
        run: |
          pnpm --filter @onusclub/web run build
          pnpm --filter @onusclub/web run start > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:4000
          NEXT_PUBLIC_WEB_BASE: http://localhost:3001
          API_BASE_INTERNAL: http://localhost:4000
          NEXTAUTH_SECRET: ci-placeholder-not-used
          NEXTAUTH_URL: http://localhost:3001

      - name: Wait for web
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3001/login > /dev/null; then
              echo "web healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "web never became ready. logs:"
          cat /tmp/web.log
          exit 1

      - name: Install Chromium for Playwright
        run: pnpm --filter @onusclub/e2e exec playwright install --with-deps chromium

      - name: Run browser tests
        env:
          E2E_WEB_BASE: http://localhost:3001
          E2E_API_BASE: http://localhost:4000
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- api ---"; cat /tmp/api.log || true
          echo "--- web ---"; cat /tmp/web.log || true

      - name: Stop web
        if: always()
        run: kill $(cat /tmp/web.pid) 2>/dev/null || true

      - name: Stop api
        if: always()
        run: kill $(cat /tmp/api.pid) 2>/dev/null || true
