services:
  mysql:
    image: mysql:8.0
    container_name: onusclub-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_dev
      MYSQL_DATABASE: stampdeck
      MYSQL_USER: stampdeck
      MYSQL_PASSWORD: stampdeck_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - stampdeck_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:20-alpine
    container_name: onusclub-api-dev
    working_dir: /repo
    command: sh -c "corepack enable && corepack prepare pnpm@9.1.0 --activate && pnpm install && pnpm --filter @onusclub/shared run build && pnpm --filter @onusclub/api run dev"
    # Pull anything in apps/api/.env (e.g. RESEND_API_KEY) into the container.
    # The explicit `environment:` block below still overrides per-key.
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://stampdeck:stampdeck_dev_pass@mysql:3306/stampdeck
      # OFF by default, and this block is why. It overrides env_file, so
      # setting these in apps/api/.env does nothing — a trap that already cost
      # us ~7 junk classes on the production issuer.
      #
      # There is only one real issuer and it is production. Pointed at it,
      # every `pnpm smoke` run creates real LoyaltyClasses named after test
      # merchants, and the Google Wallet API has **no delete operation** for
      # classes: insert, get, patch, update, list, addmessage, and that is all.
      # Whatever you create there is there forever.
      #
      # To deliberately test Google Wallet, override from the shell for one run:
      #   GOOGLE_WALLET_ISSUER_ID=33880... GOOGLE_WALLET_SA_KEY_PATH=/secrets/wallet-sa.json \
      #     docker compose -f docker-compose.dev.yml up -d api
      # then bring it back up without them. Apple Wallet is unaffected and is
      # the wallet worth testing locally anyway.
      GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-0}"
      GOOGLE_WALLET_SA_KEY_PATH: "${GOOGLE_WALLET_SA_KEY_PATH:-/tmp/nonexistent.json}"
      # 32-char minimum enforced in config.ts. Local-only value; prod reads
      # its own from .env and must be a real random secret.
      JWT_SECRET: dev_jwt_secret_change_me_not_for_production_use
      BASE_URL_WEB: http://localhost:3001
      # BASE_URL_API intentionally not set here so apps/api/.env wins. Set it
      # there to an ngrok HTTPS URL when testing Apple Wallet live updates
      # (iOS requires HTTPS for the pass webServiceURL).
    ports:
      - "4000:4000"
    volumes:
      - ./:/repo
      - api_node_modules:/repo/node_modules
      - api_api_node_modules:/repo/apps/api/node_modules
      - api_web_node_modules:/repo/apps/web/node_modules
      - api_shared_node_modules:/repo/packages/shared/node_modules
      - ./secrets:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: onusclub-web-dev
    working_dir: /repo
    command: sh -c "corepack enable && corepack prepare pnpm@9.1.0 --activate && pnpm install && pnpm --filter @onusclub/shared run build && pnpm --filter @onusclub/web run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NEXT_PUBLIC_WEB_BASE: http://localhost:3001
      API_BASE_INTERNAL: http://api:4000
      NEXTAUTH_SECRET: dev_nextauth_secret_change_me
      NEXTAUTH_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./:/repo
      - web_node_modules:/repo/node_modules
      - web_api_node_modules:/repo/apps/api/node_modules
      - web_web_node_modules:/repo/apps/web/node_modules
      - web_shared_node_modules:/repo/packages/shared/node_modules
      - web_next_cache:/repo/apps/web/.next

volumes:
  stampdeck_mysql_dev:
  api_node_modules:
  api_api_node_modules:
  api_web_node_modules:
  api_shared_node_modules:
  web_node_modules:
  web_api_node_modules:
  web_web_node_modules:
  web_shared_node_modules:
  web_next_cache:
