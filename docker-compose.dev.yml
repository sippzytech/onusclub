services:
  mysql:
    image: mysql:8.0
    container_name: stampdeck-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_dev
      MYSQL_DATABASE: stampdeck
      MYSQL_USER: stampdeck
      MYSQL_PASSWORD: stampdeck_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - stampdeck_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:20-alpine
    container_name: stampdeck-api-dev
    working_dir: /repo
    command: sh -c "corepack enable && corepack prepare pnpm@9.1.0 --activate && pnpm install && pnpm --filter @stampdeck/shared run build && pnpm --filter @stampdeck/api run dev"
    # Pull anything in apps/api/.env (e.g. RESEND_API_KEY) into the container.
    # The explicit `environment:` block below still overrides per-key.
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://stampdeck:stampdeck_dev_pass@mysql:3306/stampdeck
      GOOGLE_WALLET_ISSUER_ID: "3388000000023150410"
      GOOGLE_WALLET_SA_KEY_PATH: /secrets/wallet-sa.json
      JWT_SECRET: dev_jwt_secret_change_me
      BASE_URL_WEB: http://localhost:3001
    ports:
      - "4000:4000"
    volumes:
      - ./:/repo
      - api_node_modules:/repo/node_modules
      - api_api_node_modules:/repo/apps/api/node_modules
      - api_web_node_modules:/repo/apps/web/node_modules
      - api_shared_node_modules:/repo/packages/shared/node_modules
      - ./secrets:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: stampdeck-web-dev
    working_dir: /repo
    command: sh -c "corepack enable && corepack prepare pnpm@9.1.0 --activate && pnpm install && pnpm --filter @stampdeck/shared run build && pnpm --filter @stampdeck/web run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NEXT_PUBLIC_WEB_BASE: http://localhost:3001
      API_BASE_INTERNAL: http://api:4000
      NEXTAUTH_SECRET: dev_nextauth_secret_change_me
      NEXTAUTH_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./:/repo
      - web_node_modules:/repo/node_modules
      - web_api_node_modules:/repo/apps/api/node_modules
      - web_web_node_modules:/repo/apps/web/node_modules
      - web_shared_node_modules:/repo/packages/shared/node_modules
      - web_next_cache:/repo/apps/web/.next

volumes:
  stampdeck_mysql_dev:
  api_node_modules:
  api_api_node_modules:
  api_web_node_modules:
  api_shared_node_modules:
  web_node_modules:
  web_api_node_modules:
  web_web_node_modules:
  web_shared_node_modules:
  web_next_cache:
