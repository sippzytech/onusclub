services:
  mysql:
    image: mysql:8.0
    container_name: stampdeck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stampdeck}
      MYSQL_USER: ${MYSQL_USER:-stampdeck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Used by the init script (apps/api/src/db/init/01-reporting-user.sh) to
      # create a read-only user for n8n + Metabase dashboards.
      REPORTING_PASSWORD: ${REPORTING_PASSWORD}
    volumes:
      - stampdeck_mysql:/var/lib/mysql
      - ./apps/api/src/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      # `internal` keeps api/web talking to the DB on a private network.
      # `n8n_default` lets n8n + Metabase reach it as `stampdeck-mysql:3306`
      # without exposing anything to the public internet.
      - internal
      - n8n_default
    ports:
      # Host-only binding so anything native on the VPS (SSH tunnel, future
      # native tools) can reach the DB at 127.0.0.1:33061. The host MySQL
      # already owns 3306, so we use 33061 to coexist.
      - "127.0.0.1:33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: stampdeck/api:latest
    container_name: stampdeck-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-stampdeck}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-stampdeck}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_WALLET_SA_KEY_PATH: /secrets/wallet-sa.json
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL_WEB: https://${DOMAIN_WEB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-Stampdeck <onboarding@resend.dev>}
    volumes:
      - /docker/stampdeck/secrets:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.stampdeck-api.rule=Host(`${DOMAIN_API}`)"
      - "traefik.http.routers.stampdeck-api.entrypoints=websecure"
      - "traefik.http.routers.stampdeck-api.tls=true"
      - "traefik.http.routers.stampdeck-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stampdeck-api.loadbalancer.server.port=4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stampdeck/web:latest
    container_name: stampdeck-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_BASE: https://${DOMAIN_API}
      API_BASE_INTERNAL: http://api:4000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${DOMAIN_WEB}
    depends_on:
      - api
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.stampdeck-web.rule=Host(`${DOMAIN_WEB}`)"
      - "traefik.http.routers.stampdeck-web.entrypoints=websecure"
      - "traefik.http.routers.stampdeck-web.tls=true"
      - "traefik.http.routers.stampdeck-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stampdeck-web.loadbalancer.server.port=3001"

networks:
  internal:
  n8n_default:
    external: true

volumes:
  stampdeck_mysql:
