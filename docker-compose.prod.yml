services:
  mysql:
    image: mysql:8.0
    container_name: onusclub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # DB / user names intentionally kept as `stampdeck` — renaming a live DB
      # is non-trivial and adds zero user-visible value. Customers never see
      # this string; only Metabase/n8n SQL needs to know it.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stampdeck}
      MYSQL_USER: ${MYSQL_USER:-stampdeck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Used by the init script (apps/api/src/db/init/01-reporting-user.sh) to
      # create a read-only user for n8n + Metabase dashboards.
      REPORTING_PASSWORD: ${REPORTING_PASSWORD}
    volumes:
      # Volume name kept as stampdeck_mysql — renaming a volume = creating a
      # new empty one, which would lose all production data.
      - stampdeck_mysql:/var/lib/mysql
      - ./apps/api/src/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
      - n8n_default
    ports:
      - "127.0.0.1:33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: onusclub/api:latest
    container_name: onusclub-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-stampdeck}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-stampdeck}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_WALLET_SA_KEY_PATH: /secrets/wallet-sa.json
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL_WEB: https://${DOMAIN_WEB}
      BASE_URL_API: https://${DOMAIN_API}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-OnUsClub <onboarding@resend.dev>}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_PASS_TYPE_ID: ${APPLE_PASS_TYPE_ID:-}
      APPLE_PASS_P12_PATH: ${APPLE_PASS_P12_PATH:-/secrets/apple/onusclub-pass.p12}
      APPLE_PASS_P12_PASSWORD: ${APPLE_PASS_P12_PASSWORD:-}
      APPLE_WWDR_PATH: ${APPLE_WWDR_PATH:-/secrets/apple/AppleWWDRCAG4.pem}
      APPLE_APNS_P12_PATH: ${APPLE_APNS_P12_PATH:-/secrets/apple/onusclub-push.p12}
      APPLE_APNS_P12_PASSWORD: ${APPLE_APNS_P12_PASSWORD:-}
      # Preferred load path on Node 20: pre-extracted PEM cert + key. The
      # .p12 + node-forge path is silently rejected by Node's TLS during the
      # APNs client-cert handshake. Generate the PEMs once with openssl, set
      # these to the resulting paths inside /secrets/.
      APPLE_APNS_CERT_PEM_PATH: ${APPLE_APNS_CERT_PEM_PATH:-}
      APPLE_APNS_KEY_PEM_PATH: ${APPLE_APNS_KEY_PEM_PATH:-}
    volumes:
      # VPS dir name kept as /docker/stampdeck/secrets/ — rename later when we
      # move the deploy dir (separate maintenance window).
      - /docker/stampdeck/secrets:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      # Primary router — DOMAIN_API drives BASE_URL_API too, so this is the
      # canonical domain new email links / wallet webServiceURLs point at.
      - "traefik.http.routers.onusclub-api.rule=Host(`${DOMAIN_API}`)"
      - "traefik.http.routers.onusclub-api.entrypoints=websecure"
      - "traefik.http.routers.onusclub-api.tls=true"
      - "traefik.http.routers.onusclub-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.onusclub-api.loadbalancer.server.port=4000"
      # Legacy router — set DOMAIN_API_LEGACY in .env (e.g. api.sippzy.com)
      # during the migration window so the old domain still routes here.
      # When left unset the rule becomes Host(`_disabled_`) which never
      # matches a real request, so this router is effectively a no-op.
      - "traefik.http.routers.onusclub-api-legacy.rule=Host(`${DOMAIN_API_LEGACY:-_disabled_}`)"
      - "traefik.http.routers.onusclub-api-legacy.entrypoints=websecure"
      - "traefik.http.routers.onusclub-api-legacy.tls=true"
      - "traefik.http.routers.onusclub-api-legacy.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.onusclub-api-legacy.service=onusclub-api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: onusclub/web:latest
    container_name: onusclub-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_BASE: https://${DOMAIN_API}
      NEXT_PUBLIC_WEB_BASE: https://${DOMAIN_WEB}
      API_BASE_INTERNAL: http://api:4000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${DOMAIN_WEB}
    depends_on:
      - api
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.onusclub-web.rule=Host(`${DOMAIN_WEB}`)"
      - "traefik.http.routers.onusclub-web.entrypoints=websecure"
      - "traefik.http.routers.onusclub-web.tls=true"
      - "traefik.http.routers.onusclub-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.onusclub-web.loadbalancer.server.port=3001"
      # Legacy router — same pattern as api above.
      - "traefik.http.routers.onusclub-web-legacy.rule=Host(`${DOMAIN_WEB_LEGACY:-_disabled_}`)"
      - "traefik.http.routers.onusclub-web-legacy.entrypoints=websecure"
      - "traefik.http.routers.onusclub-web-legacy.tls=true"
      - "traefik.http.routers.onusclub-web-legacy.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.onusclub-web-legacy.service=onusclub-web"

networks:
  internal:
  n8n_default:
    external: true

volumes:
  stampdeck_mysql:
